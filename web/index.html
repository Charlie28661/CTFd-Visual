<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTFd Visual — 即時題目流量</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1 id="title">CTFd Visual</h1>
      <span class="sub">即時題目流量</span>
      <span id="demo-badge" class="badge" hidden>DEMO</span>
    </div>

    <div class="tiles">
      <div class="tile"><div class="tile-v" id="t-rps">0</div><div class="tile-l">請求 / 秒</div></div>
      <div class="tile"><div class="tile-v" id="t-actors">0</div><div class="tile-l" id="t-actors-l">活躍隊伍</div></div>
      <div class="tile"><div class="tile-v" id="t-solves">0</div><div class="tile-l">解題數</div></div>
      <div class="tile"><div class="tile-v" id="t-total">0</div><div class="tile-l">累計請求</div></div>
    </div>

    <div class="controls">
      <div class="seg" role="group" aria-label="顯示單位">
        <button type="button" data-mode="team" class="on">隊伍</button>
        <button type="button" data-mode="user">個人</button>
      </div>
      <div class="chips" role="group" aria-label="事件類型">
        <button type="button" class="chip on" data-filter="platform" title="瀏覽題目、下載附件、看提示">平台操作</button>
        <button type="button" class="chip on" data-filter="traffic" title="直接連到題目服務的流量">題目連線</button>
        <button type="button" class="chip on" data-filter="submit" title="提交 flag（答錯 / 解出）">Flag 提交</button>
      </div>
      <button type="button" class="chip on" id="chip-cine" aria-pressed="true" title="有人拿下題目首殺時，播放鏡頭特寫動畫">首殺特寫</button>
      <button type="button" class="icon-btn" id="btn-full" title="全螢幕">⛶</button>
      <span class="status" id="status"><i></i><span>連線中…</span></span>
    </div>
  </header>

  <main class="grid">
    <aside class="panel" id="p-chals">
      <h2>題目熱度 <small>近 60 秒請求數</small></h2>
      <ol class="rank" id="rank-chals"></ol>
    </aside>

    <section class="center">
      <div class="flow" id="flow">
        <canvas id="cv"></canvas>
        <div class="card" id="card" hidden></div>
        <div class="toasts" id="toasts"></div>
        <div class="legend" id="legend"></div>
        <div class="hint">滑鼠移到節點看詳情 · 點一下固定</div>
        <div class="cine" id="cine" aria-live="polite">
          <div class="bar top"></div>
          <div class="bar bottom"></div>
          <div class="cine-cap">
            <span class="cine-tag">首殺 · FIRST BLOOD</span>
            <div class="cine-main" id="cine-main"></div>
            <div class="cine-sub" id="cine-sub"></div>
          </div>
        </div>
        <div class="empty" id="empty" hidden>
          <strong>等待資料中…</strong>
          <span>尚未收到任何題目或流量事件。請確認 CTFd 外掛或收集器已啟動，或用 <code>python server.py --demo</code> 預覽。</span>
        </div>
      </div>
      <div class="panel timeline">
        <h2>每秒請求數 <small>最近 5 分鐘</small>
          <span class="tl-legend">
            <span><i class="k k-bar"></i>請求</span>
            <span><i class="k k-solve"></i>解出</span>
            <span><i class="k k-fail"></i>答錯</span>
          </span>
        </h2>
        <div class="tl-wrap">
          <canvas id="tl"></canvas>
          <div class="tip" id="tl-tip" hidden></div>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="panel" id="p-actors">
        <h2><span id="actors-title">活躍隊伍</span> <small>近 60 秒請求數</small></h2>
        <ol class="rank" id="rank-actors"></ol>
      </div>
      <div class="panel" id="p-feed">
        <h2>即時動態</h2>
        <ul class="feed" id="feed"></ul>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
